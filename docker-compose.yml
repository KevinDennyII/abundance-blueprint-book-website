services:
  postgres:
    image: postgres:16-alpine
    container_name: abundance-blog-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: abundance
      POSTGRES_PASSWORD: abundance
      POSTGRES_DB: abundance_blog
    volumes:
      - abundance_blog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abundance -d abundance_blog"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  abundance_blog_pgdata:
