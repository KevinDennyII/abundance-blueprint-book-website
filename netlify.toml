[build]
  command = "pnpm --filter @workspace/abundance-blueprint run build"
  publish = "artifacts/abundance-blueprint/dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.33.4"
  BASE_PATH = "/"
  PORT = "5173"

[[redirects]]
  from = "/api/kit/subscribe"
  to = "/.netlify/functions/kit-subscribe"
  status = 200

[[redirects]]
  from = "/api/readiness-lead"
  to = "/.netlify/functions/readiness-lead"
  status = 200

# The Long Money Letter lives on the letter subdomain
[[redirects]]
  from = "/articles"
  to = "https://letter.longmoneyconcepts.com"
  status = 301
  force = true

[[redirects]]
  from = "/articles/*"
  to = "https://letter.longmoneyconcepts.com"
  status = 301
  force = true

[[redirects]]
  from = "/blog"
  to = "https://letter.longmoneyconcepts.com"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "https://letter.longmoneyconcepts.com"
  status = 301
  force = true

# Client-side routing (wouter)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
