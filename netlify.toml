[build]
  command = "pnpm --filter @workspace/abundance-blueprint run build"
  publish = "artifacts/abundance-blueprint/dist/public"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.33.4"
  BASE_PATH = "/"
  PORT = "5173"

# Client-side routing (wouter)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
