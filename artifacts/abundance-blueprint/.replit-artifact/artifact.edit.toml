kind = "web"
previewPath = "/"
title = "Abundance Blueprint — La'Toya Ray, CPA"
version = "1.0.0"
id = "artifacts/abundance-blueprint"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21403

[services.development]
run = "pnpm --filter @workspace/abundance-blueprint run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/abundance-blueprint", "run", "build" ]

[services.production.run]
args = [ "node", "artifacts/abundance-blueprint/server.mjs" ]

[services.env]
PORT = "21403"
BASE_PATH = "/"
