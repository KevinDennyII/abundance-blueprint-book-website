kind = "web"
previewPath = "/"
title = "Abundance Blueprint — La'Toya Ray, CPA"
version = "1.0.0"
id = "artifacts/abundance-blueprint"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21403

[services.development]
run = "pnpm --filter @workspace/abundance-blueprint run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/abundance-blueprint", "run", "build" ]
serve = "node artifacts/abundance-blueprint/server.mjs"

[services.production.build.env]
NODE_ENV = "production"
BASE_PATH = "/"
PORT = "21403"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21403"
BASE_PATH = "/"
